{% extends 'base.html' %}

{% block content %}
    <h3>Edit Product</h3>
    <form method="POST">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
        </div>
        <div class="form-group">
            <label for="price">Price:</label>
            <input type="number" name="price" class="form-control" value="{{ product.price }}" min="0" step="0.01" required>
        </div>
        <div class="form-group">
            <label for="quantity">Quantity:</label>
            <input type="number" name="quantity" class="form-control" value="{{ product.quantity }}" min="0" required>
        </div>
        <div class="form-group mb-3"><label for="category" class="form-label">Category</label><select name="category" id="category" class="form-select">{% for category in ['Printing', 'Binding', 'Laminating', 'Sticker', 'Stationery', 'Other'] %}<option {% if product.category == category %}selected{% endif %}>{{ category }}</option>{% endfor %}</select></div>
        <button type="submit" class="btn btn-primary">Update Product</button>
    </form>
{% endblock %}
